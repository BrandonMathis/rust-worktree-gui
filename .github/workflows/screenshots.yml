# Screenshots of the app for pull requests that change how it looks. A cheap
# Linux job first picks the states that show the files the PR changes
# (script/capture/states.rb, via select.rb), so reviewers see the feature being
# added or modified, and a PR that changes nothing a state shows (such as a
# dependency update) starts no macOS runner at all. The macOS job builds the app
# with `--features capture` and runs script/capture/capture.rb for those states
# (fixture repos plus a private tmux server with vim and shell splits); the PNGs
# are linked from one PR comment that is updated on each push.
#
# Nothing is committed to the repository. The PNGs are workflow artifacts, which
# expire on their own: one zip of everything from the macOS job, then each PNG
# again as its own unzipped artifact so the comment can link straight to an
# image. GitHub has no API for uploading comment images, so the comment links
# to the screenshots rather than showing them inline.
name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # A coarse filter; the plan job decides which states, if any, to capture.
    # Cargo.toml and Cargo.lock are left out: a dependency update is not a UI
    # change, so release and Dependabot PRs get no screenshots.
    paths:
      - src/**
      - vendor/iced_term/src/**
      - assets/**
      - script/capture/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with `.tool-versions`.
  RUST_VERSION: 1.90.0

jobs:
  plan:
    name: Choose states
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      states: ${{ steps.select.outputs.states }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit; depth 2 adds the base (its first
          # parent), so the diff below is exactly what the PR changes.
          fetch-depth: 2
      - name: Test the state selection
        run: ruby script/capture/test/states_test.rb
      - name: Select the states that show this PR's changes
        id: select
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            states=$(git diff --name-only -z HEAD^1 HEAD |
              ruby script/capture/select.rb --summary "$GITHUB_STEP_SUMMARY")
          else
            states=$(ruby script/capture/select.rb --all --summary "$GITHUB_STEP_SUMMARY")
          fi
          echo "states=$states" >> "$GITHUB_OUTPUT"
          # The same names as a JSON array, for the `images` job's matrix.
          echo "matrix=$(ruby -rjson -e 'puts ARGV[0].split(",").to_json' "$states")" >> "$GITHUB_OUTPUT"

  capture:
    name: Capture
    needs: plan
    if: needs.plan.outputs.states != ''
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: capture
      - run: brew install tmux
      - run: cargo build --locked --features capture
      - name: Capture screenshots
        env:
          STATES: ${{ needs.plan.outputs.states }}
        run: ruby script/capture/capture.rb --out screenshots --only "$STATES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          # The .log files hold the app's stderr for each state.
          path: screenshots/
          if-no-files-found: ignore

  images:
    name: Image (${{ matrix.state }})
    needs: [plan, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Artifacts of the same run are read and written with the runner's own
    # token, so this job needs no permissions.
    permissions: {}
    strategy:
      # `archive: false` uploads one file per step, so each state gets a job.
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: screenshots
      # Unzipped, so the link in the comment leads to the PNG itself. The
      # artifact is named after the file (`01-workspace.png`).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: screenshots/${{ matrix.state }}.png
          archive: false
          if-no-files-found: error

  publish:
    name: Comment
    needs: images
    # Fork PRs get a read-only token, so they only get the artifacts.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list this run's artifacts
      pull-requests: write # create or update the comment
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: screenshots
      - name: Create or update the PR comment
        run: |
          set -euo pipefail
          # One "name<TAB>id" line per artifact of this run.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | [.name, .id] | @tsv' > artifacts.tsv
          ruby script/capture/comment.rb screenshots artifacts.tsv "$HEAD_SHA" "$RUN_URL" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          marker='<!-- worktree-browser-screenshots -->'
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
