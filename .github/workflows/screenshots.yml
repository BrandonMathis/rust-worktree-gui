# Screenshots of the app for pull requests that touch the UI. Builds the app
# with `--features capture`, runs script/capture/capture.rb (fixture repos plus
# a private tmux server with vim and shell splits), and posts the PNGs in one
# PR comment that is updated on each push.
#
# The PNGs are committed to the `pr-screenshots` branch so the comment can show
# them inline (GitHub has no API for uploading comment images). They are also
# uploaded as a workflow artifact.
name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Files that can change what the app looks like.
    paths:
      - src/app.rs
      - src/capture.rs
      - src/create.rs
      - src/icons.rs
      - src/main.rs
      - src/quit.rs
      - src/row_menu.rs
      - src/style.rs
      - src/terminal.rs
      - src/terminal_config.rs
      - vendor/iced_term/**
      - assets/**
      - Cargo.toml
      - Cargo.lock
      - script/capture/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with `.tool-versions`.
  RUST_VERSION: 1.90.0
  SCREENSHOT_BRANCH: pr-screenshots

jobs:
  capture:
    name: Capture
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: capture
      - run: brew install tmux
      - run: cargo build --locked --features capture
      - name: Capture screenshots
        run: ruby script/capture/capture.rb --out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          # The .log files hold the app's stderr for each state.
          path: screenshots/
          if-no-files-found: ignore

  publish:
    name: Comment
    needs: capture
    # Fork PRs get a read-only token, so they only get the artifact.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push PNGs to the screenshot branch
      pull-requests: write # create or update the comment
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Push PNGs to the screenshot branch
        id: push
        run: |
          set -euo pipefail
          dir="pr-$PR/${HEAD_SHA::7}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin "$SCREENSHOT_BRANCH"; then
            git worktree add --detach publish FETCH_HEAD
          else
            # First run: start the branch with no history from main.
            git worktree add --detach publish
            git -C publish checkout --orphan "$SCREENSHOT_BRANCH"
            git -C publish rm -rfq .
          fi
          mkdir -p "publish/$dir"
          cp screenshots/*.png "publish/$dir/"
          git -C publish add -A
          git -C publish commit -qm "Screenshots for #$PR at ${HEAD_SHA::7}"
          # Another PR may push at the same time; rebase and retry.
          for attempt in 1 2 3 4; do
            git -C publish push origin "HEAD:$SCREENSHOT_BRANCH" && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 2))
            git -C publish fetch --depth=1 origin "$SCREENSHOT_BRANCH"
            git -C publish rebase FETCH_HEAD
          done
          # Pin the image URLs to this commit so later pushes can't change them.
          commit=$(git -C publish rev-parse HEAD)
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/$commit/$dir" >> "$GITHUB_OUTPUT"
      - name: Create or update the PR comment
        env:
          BASE_URL: ${{ steps.push.outputs.base }}
        run: |
          set -euo pipefail
          ruby script/capture/comment.rb screenshots "$BASE_URL" "$HEAD_SHA" "$RUN_URL" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          marker='<!-- worktree-browser-screenshots -->'
          ids=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
