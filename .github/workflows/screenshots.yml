# Screenshots of the app for pull requests that change how it looks. A cheap
# Linux job first picks the states that show the files the PR changes
# (script/capture/states.rb, via select.rb), so reviewers see the feature being
# added or modified, and a PR that changes nothing a state shows (such as a
# dependency update) starts no macOS runner at all. The macOS job builds the app
# with `--features capture` and runs script/capture/capture.rb for those states
# (fixture repos plus a private tmux server with vim and shell splits); the PNGs
# are posted in one PR comment that is updated on each push.
#
# The PNGs are committed to the `pr-screenshots` branch so the comment can show
# them inline (GitHub has no API for uploading comment images). They are also
# uploaded as a workflow artifact.
name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # A coarse filter; the plan job decides which states, if any, to capture.
    # Cargo.toml and Cargo.lock are left out: a dependency update is not a UI
    # change, so release and Dependabot PRs get no screenshots.
    paths:
      - src/**
      - vendor/iced_term/src/**
      - assets/**
      - script/capture/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with `.tool-versions`.
  RUST_VERSION: 1.90.0
  SCREENSHOT_BRANCH: pr-screenshots

jobs:
  plan:
    name: Choose states
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      states: ${{ steps.select.outputs.states }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit; depth 2 adds the base (its first
          # parent), so the diff below is exactly what the PR changes.
          fetch-depth: 2
      - name: Test the state selection
        run: ruby script/capture/test/states_test.rb
      - name: Select the states that show this PR's changes
        id: select
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            states=$(git diff --name-only -z HEAD^1 HEAD |
              ruby script/capture/select.rb --summary "$GITHUB_STEP_SUMMARY")
          else
            states=$(ruby script/capture/select.rb --all --summary "$GITHUB_STEP_SUMMARY")
          fi
          echo "states=$states" >> "$GITHUB_OUTPUT"

  capture:
    name: Capture
    needs: plan
    if: needs.plan.outputs.states != ''
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: capture
      - run: brew install tmux
      - run: cargo build --locked --features capture
      - name: Capture screenshots
        env:
          STATES: ${{ needs.plan.outputs.states }}
        run: ruby script/capture/capture.rb --out screenshots --only "$STATES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          # The .log files hold the app's stderr for each state.
          path: screenshots/
          if-no-files-found: ignore

  publish:
    name: Comment
    needs: capture
    # Fork PRs get a read-only token, so they only get the artifact.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push PNGs to the screenshot branch
      pull-requests: write # create or update the comment
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: screenshots
      - name: Push PNGs to the screenshot branch
        id: push
        run: |
          set -euo pipefail
          dir="pr-$PR/${HEAD_SHA::7}"
          # Checkout does not persist credentials, so authenticate this remote only.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin "$SCREENSHOT_BRANCH"; then
            git worktree add --detach publish FETCH_HEAD
          else
            # First run: start the branch with no history from main.
            git worktree add --detach publish
            git -C publish checkout --orphan "$SCREENSHOT_BRANCH"
            git -C publish rm -rfq .
          fi
          mkdir -p "publish/$dir"
          cp screenshots/*.png "publish/$dir/"
          git -C publish add -A
          git -C publish commit -qm "Screenshots for #$PR at ${HEAD_SHA::7}"
          # Another PR may push at the same time; rebase and retry.
          for attempt in 1 2 3 4; do
            git -C publish push origin "HEAD:$SCREENSHOT_BRANCH" && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 2))
            git -C publish fetch --depth=1 origin "$SCREENSHOT_BRANCH"
            git -C publish rebase FETCH_HEAD
          done
          # Pin the image URLs to this commit so later pushes can't change them.
          commit=$(git -C publish rev-parse HEAD)
          echo "base=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$commit/$dir" >> "$GITHUB_OUTPUT"
      - name: Create or update the PR comment
        env:
          BASE_URL: ${{ steps.push.outputs.base }}
        run: |
          set -euo pipefail
          ruby script/capture/comment.rb screenshots "$BASE_URL" "$HEAD_SHA" "$RUN_URL" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          marker='<!-- worktree-browser-screenshots -->'
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
