[package]
name = "rust-worktree-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
# Fixture tests are included by the binary's test module to exercise its private code.
autotests = false

[dependencies]
directories = "6"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "crisp", "tokio", "x11", "wayland"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
