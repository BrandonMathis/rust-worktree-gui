[package]
name = "rust-worktree-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
# Fixture tests are included by the binary's test module to exercise its private code.
autotests = false

[dependencies]
directories = "6"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "svg", "crisp", "tokio", "x11", "wayland"] }
iced_term = "=0.8.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["process", "rt", "time"] }
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
crossfont = "=0.8.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[patch.crates-io]
iced_term = { path = "vendor/iced_term" }

# Optimize dependencies even in dev builds. The terminal draw loop (iced, wgpu,
# cosmic-text, alacritty_terminal and the vendored iced_term) is too slow
# unoptimized for typing and scrolling to feel instant. This crate stays at
# opt-level 0, so incremental rebuilds remain fast.
[profile.dev.package."*"]
opt-level = 3
