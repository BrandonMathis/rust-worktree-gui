[package]
name = "rust-worktree-gui"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
publish = false
# Fixture tests are included by the binary's test module to exercise its private code.
autotests = false

[dependencies]
directories = "6"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "svg", "canvas", "crisp", "tokio", "x11", "wayland"] }
iced_term = "=0.8.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
toml = "1.1"
# Only for the keystroke-latency harness (`--features perf`): a headless
# `UserInterface` and task streams. Already in the tree through iced.
iced_runtime = { version = "=0.14.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
crossfont = "=0.9.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
raw-window-handle = "0.6"

# The vendored iced_term is a workspace member, and a default member, so plain
# `cargo test`, `cargo clippy` and `cargo llvm-cov` also run its tests (including
# the NFR-08 performance tests) and lints. `[patch]` swaps it in for crates.io.
[workspace]
members = [".", "vendor/iced_term"]
default-members = [".", "vendor/iced_term"]

[features]
# Startup hooks for the PR screenshot workflow (`src/capture.rs`). Off by default.
capture = []
# The keystroke-latency harness (`src/perf/`), run on every PR by
# `.github/workflows/latency.yml` through `scripts/latency.rb`. Off by default.
perf = ["dep:iced_runtime"]

[patch.crates-io]
iced_term = { path = "vendor/iced_term" }

# Optimize dependencies even in dev builds. The terminal draw loop (iced, wgpu,
# cosmic-text, alacritty_terminal and the vendored iced_term) is too slow
# unoptimized for typing and scrolling to feel instant. This crate stays at
# opt-level 0, so incremental rebuilds remain fast.
[profile.dev.package."*"]
opt-level = 3

# `"*"` covers only non-members, so name the vendored terminal explicitly now
# that it is a workspace member.
[profile.dev.package.iced_term]
opt-level = 3

# Lints checked by `cargo clippy` locally and in CI (`.github/workflows/ci.yml`).
# Panicking helpers are denied in app code because errors must reach the user
# as a notice, never crash the app. `clippy.toml` allows them inside tests.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
