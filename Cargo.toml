[package]
name = "rust-worktree-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
# Fixture tests are included by the binary's test module to exercise its private code.
autotests = false

[dependencies]
directories = "6"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "svg", "crisp", "tokio", "x11", "wayland"] }
iced_term = "=0.8.0"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["process", "rt", "time"] }
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
crossfont = "=0.8.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[patch.crates-io]
iced_term = { path = "vendor/iced_term" }

# Lints checked by `cargo clippy` locally and in CI (`.github/workflows/ci.yml`).
# Panicking helpers are denied in app code because errors must reach the user
# as a notice, never crash the app. `clippy.toml` allows them inside tests.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
