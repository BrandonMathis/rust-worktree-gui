# Config for the screenshot tmux server only (the capture script passes it
# with -f). It never touches the user's ~/.tmux.conf.
set -g default-terminal "screen-256color"
set -g default-shell /bin/zsh
set -g escape-time 0
set -g mouse on
set -g status-style "bg=#21222c,fg=#f8f8f2"
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #{b:pane_current_path} #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#6272a4]worktree-browser "
set -g window-status-current-format "#[fg=#50fa7b]#I:#W"
set -g window-status-format "#[fg=#6272a4]#I:#W"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
